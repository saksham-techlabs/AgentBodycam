# Quality gate for every push to main and every pull request. Also called by
# release-build.yml, which reuses these jobs to produce release artifacts.
#
# Nothing here publishes, tags, releases or writes to the repository.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      artifact-retention-days:
        description: Days to keep the built wheel and sdist.
        type: number
        default: 7

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"

jobs:
  frontend:
    name: Frontend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Test
        working-directory: web
        run: npm run test

      - name: Build production UI
        working-directory: web
        run: npm run build

      # The build rewrites src/agentbodycam/ui/static/. Any difference from the committed
      # tree (changed, deleted or new files) means the assets were not regenerated.
      - name: Committed UI assets match the build
        run: |
          changes="$(git status --porcelain --untracked-files=all)"
          if [ -n "$changes" ]; then
            echo "::error::The production build differs from the committed files. Run 'npm run build' in web/ and commit src/agentbodycam/ui/static/."
            echo "$changes"
            git --no-pager diff --stat
            exit 1
          fi
          echo "Committed UI assets match the production build."

  python:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      # Format check, lint, strict mypy and the full pytest suite: platform-specific,
      # security/privacy, no-network and packaging (wheel + sdist + installed wheel) tests.
      - name: Quality gate
        run: python scripts/check.py

  package:
    name: Package (wheel + sdist, installed-wheel smoke)
    needs: [frontend, python]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Build wheel and sdist
        run: python -m hatchling build

      # The packaging tests inspect, rebuild-and-compare and install exactly these files
      # (offline, in a fresh venv, with no Node.js, npm, Git or checkout on PATH).
      - name: Verify the built artifacts
        env:
          AGENTBODYCAM_TEST_DIST: dist
        run: python -m pytest tests/test_packaging.py

      - uses: actions/upload-artifact@v7
        with:
          name: agentbodycam-dist-${{ github.sha }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: ${{ inputs.artifact-retention-days || 7 }}
